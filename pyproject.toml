[project]
name = "agentic-feishu"
version = "0.1.0"
description = "Native multi-model agent framework for Feishu"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "lark-oapi>=1.4.0",
    "websockets>=12,<14",
    "pydantic>=2.0",
    "aiosqlite>=0.20.0",
    "tiktoken>=0.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]
